name: Bug report
description: Report a relay or website compatibility problem
body:
  - type: input
    id: version
    attributes:
      label: Extension and Chrome versions
      placeholder: AI Relay 0.3.0, Chrome ...
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: Where did it fail?
      options:
        - ChatGPT
        - Claude
        - Dashboard / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
      description: Include relay mode and whether the message was pasted, submitted, or captured. Use harmless example prompts.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Actual behavior and error text
      description: Remove private prompt text, account information, and sensitive screenshots.
    validations:
      required: true
